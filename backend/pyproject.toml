[project]
name = "truck-routing-backend"
version = "0.1.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.7",
    "django-environ>=0.12",
    "httpx>=0.28",
    "tenacity>=9.1",
    "polyline>=2.0",
    "redis>=6.0",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "respx>=0.22",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]

[tool.ruff.format]
quote-style = "double"
